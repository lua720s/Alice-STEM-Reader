<!doctype html>
<html lang="ja" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PDF LaTeX Overlay</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<!-- 数式プレビュー用（任意）。読み込めなければプレビューなしで動く -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header id="topbar">
  <button id="sidebar-toggle" class="icon-btn" aria-label="コレクションを開閉" title="コレクション（B）" aria-pressed="true">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
  </button>
  <div class="title">
    <strong id="docname">PDF LaTeX Overlay</strong>
    <span id="stats" class="muted"></span>
  </div>
  <span class="spacer"></span>
  <span id="autostat" class="status" role="status"></span>
  <button id="autorun" title="未処理のページの数式を検出して認識する">全ページを認識</button>
  <select id="mode" title="埋め込み方式" aria-label="埋め込み方式">
    <option value="invisible">不可視テキスト（既定）</option>
    <option value="actualtext">ActualText</option>
  </select>
  <label class="toggle"><input type="checkbox" id="onlyconfirmed"> 確定済みのみ</label>
  <button id="export" class="primary">PDFを保存</button>
  <div class="seg" role="group" aria-label="テーマ">
    <button type="button" data-theme-set="system" title="自動（OSの設定に合わせる）" aria-label="自動">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
    <button type="button" data-theme-set="light" title="ライトモード" aria-label="ライトモード">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    </button>
    <button type="button" data-theme-set="dark" title="ダークモード" aria-label="ダークモード">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div id="layout" class="sb-open">
  <aside id="sidebar" aria-label="コレクション">
    <div class="sb-head">
      <span class="sb-title">コレクション</span>
      <span class="spacer"></span>
      <button id="tree-collapse" class="icon-btn small" title="すべて閉じる" aria-label="すべて閉じる">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l5-4 5 4M7 16l5 4 5-4"/></svg>
      </button>
      <button id="tree-refresh" class="icon-btn small" title="一覧を更新" aria-label="一覧を更新">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
    <div class="sb-search"><input id="tree-filter" type="search" placeholder="PDFを検索（/）" aria-label="PDFを検索" autocomplete="off" spellcheck="false"></div>
    <div id="tree" role="tree" aria-label="PDFの一覧"></div>
    <div id="tree-foot" class="sb-foot muted"></div>
  </aside>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="コレクションの幅" tabindex="0"></div>

  <main>
    <section id="deck" aria-label="ページ">
      <div id="pages"></div>
      <div id="emptydeck">
        <div>
          <p class="big">PDFを選んでください</p>
          <p class="muted">左のコレクションからPDFを選ぶと、ページが1枚ずつ表示されます。<br>
            <kbd>←</kbd><kbd>→</kbd> でページ送り、<kbd>F</kbd> で表示の切り替え、<kbd>B</kbd> でコレクションの開閉。</p>
        </div>
      </div>
      <button id="prev" class="nav prev" aria-label="前のページ" title="前のページ（←）">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="next" class="nav next" aria-label="次のページ" title="次のページ（→）">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div id="pagebar" role="group" aria-label="ページ送り">
        <button id="prev2" class="icon-btn small" aria-label="前のページ">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <input id="pageslider" type="range" min="1" max="1" value="1" aria-label="ページ">
        <span id="pageno" aria-live="polite">- / -</span>
        <button id="next2" class="icon-btn small" aria-label="次のページ">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <span class="vsep"></span>
        <div class="seg small" role="group" aria-label="表示">
          <button type="button" data-fit="page" title="ページ全体を1画面に収める（F）">全体</button>
          <button type="button" data-fit="width" title="幅に合わせて縦にスクロール（F）">幅</button>
        </div>
      </div>
    </section>

    <aside id="panel">
      <div id="empty" class="muted">PDFを開くと、全ページの数式を自動で検出・認識します（上部に進み具合を表示）。<br>
        枠をクリックするとLaTeXをコピーし、ここで確認・修正できます。見落とした式は、ページ上をドラッグして追加できます（複数行も可）。</div>
      <div id="detail" hidden>
        <div class="row"><b id="fid"></b><span id="fstatus" class="badge"></span><span id="fsource" class="muted"></span></div>
        <img id="crop" alt="元PDFの切り出し">
        <div id="preview" class="preview" aria-label="数式プレビュー"></div>
        <label for="latex">LaTeX（修正可）</label>
        <textarea id="latex" spellcheck="false" rows="5"></textarea>
        <div class="row buttons">
          <button id="copy" class="primary" title="C">コピー</button>
          <button id="save">修正を保存</button>
          <button id="confirm">確定</button>
          <button id="exclude">除外</button>
        </div>
        <div class="row buttons">
          <button id="recognize">この枠を再認識</button>
          <button id="redraw">枠を引き直す</button>
          <button id="delete" class="danger">削除</button>
        </div>
        <details><summary>OCR原文</summary><pre id="ocr"></pre></details>
        <p id="reason" class="muted"></p>
      </div>
    </aside>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
