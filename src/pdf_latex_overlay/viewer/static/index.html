<!doctype html>
<html lang="ja" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>PDF LaTeX Overlay</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="style.css">
<!-- 数式プレビュー用（任意）。読み込めなければプレビューなしで動く -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="i18n.js"></script>
<script defer src="app.js"></script>
</head>
<body>
<header id="topbar">
  <button id="sidebar-toggle" class="icon-btn" aria-label="コレクションを開閉" title="コレクション（B）" aria-pressed="true" data-i18n-title="コレクション（B）" data-i18n-label="コレクションを開閉">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
  </button>
  <div class="title">
    <strong id="docname" tabindex="0" title="クリックして名前を変更" data-i18n-title="クリックして名前を変更">PDF LaTeX Overlay</strong>
    <span id="stats" class="muted"></span>
    <button id="reviewbtn" class="review-btn" type="button" hidden title="次の要確認へ（N、前へは Shift+N）" data-i18n-title="次の要確認へ（N、前へは Shift+N）"><span id="reviewcount"></span></button>
  </div>
  <button id="doc-menu" class="icon-btn" aria-label="このPDFのメニュー" title="このPDFのメニュー（名前を変更・移動・削除・OCR）" aria-haspopup="menu" disabled data-i18n-title="このPDFのメニュー（名前を変更・移動・削除・OCR）" data-i18n-label="このPDFのメニュー">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
  </button>
  <span class="spacer"></span>
  <span id="autostat" class="status" role="status"></span>
  <select id="engine" title="認識エンジン（式の読み取りに使うモデル）" aria-label="認識エンジン" data-i18n-title="認識エンジン（式の読み取りに使うモデル）" data-i18n-label="認識エンジン"></select>
  <button id="autorun" title="いま表示しているページの数式を検出して認識する（PDF全体は、⋯ の「OCRを行う」）" data-i18n-title="いま表示しているページの数式を検出して認識する（PDF全体は、⋯ の「OCRを行う」）" data-i18n="このページを認識">このページを認識</button>
  <button id="textrun" title="いま表示しているページの文章（日本語など）を読み取る。数式の枠は読まない" data-i18n-title="いま表示しているページの文章（日本語など）を読み取る。数式の枠は読まない" data-i18n="このページの文章を認識">このページの文章を認識</button>
  <select id="mode" title="埋め込み方式" aria-label="埋め込み方式" data-i18n-title="埋め込み方式" data-i18n-label="埋め込み方式">
    <option value="invisible" data-i18n="不可視テキスト（既定）">不可視テキスト（既定）</option>
    <option value="actualtext">ActualText</option>
  </select>
  <label class="toggle"><input type="checkbox" id="onlyconfirmed"> <span data-i18n="確定済みのみ"></span></label>
  <button id="export" class="primary" data-i18n="PDFを保存">PDFを保存</button>
  <select id="lang" title="Language / 言語 / 语言 / Idioma / Язык" aria-label="Language"></select>
  <div class="seg" role="group" aria-label="テーマ" data-i18n-label="テーマ">
    <button type="button" data-theme-set="system" title="自動（OSの設定に合わせる）" aria-label="自動" data-i18n-title="自動（OSの設定に合わせる）" data-i18n-label="自動">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
    <button type="button" data-theme-set="light" title="ライトモード" aria-label="ライトモード" data-i18n-title="ライトモード" data-i18n-label="ライトモード">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>
    </button>
    <button type="button" data-theme-set="dark" title="ダークモード" aria-label="ダークモード" data-i18n-title="ダークモード" data-i18n-label="ダークモード">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div id="layout" class="sb-open">
  <aside id="sidebar" aria-label="コレクション" data-i18n-label="コレクション">
    <div class="sb-head">
      <span class="sb-title" data-i18n="コレクション">コレクション</span>
      <span class="spacer"></span>
      <button id="tree-newfolder" class="icon-btn small" title="新しいフォルダ" aria-label="新しいフォルダ" data-i18n-title="新しいフォルダ" data-i18n-label="新しいフォルダ">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
      </button>
      <button id="tree-select" class="icon-btn small" title="複数選択（⌘/Ctrl＋クリックでも選べる）" aria-label="複数選択" aria-pressed="false" data-i18n-title="複数選択（⌘/Ctrl＋クリックでも選べる）" data-i18n-label="複数選択">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
      </button>
      <button id="tree-collapse" class="icon-btn small" title="すべて閉じる" aria-label="すべて閉じる" data-i18n-title="すべて閉じる" data-i18n-label="すべて閉じる">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l5-4 5 4M7 16l5 4 5-4"/></svg>
      </button>
      <button id="tree-refresh" class="icon-btn small" title="一覧を更新" aria-label="一覧を更新" data-i18n-title="一覧を更新" data-i18n-label="一覧を更新">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
    <div class="sb-search"><input id="tree-filter" type="search" placeholder="PDFを検索（/）" aria-label="PDFを検索" autocomplete="off" spellcheck="false" data-i18n-label="PDFを検索" data-i18n-ph="PDFを検索（/）"></div>
    <div id="tree" role="tree" aria-label="PDFの一覧" data-i18n-label="PDFの一覧"></div>
    <div id="selbar" hidden>
      <span id="selcount"></span>
      <button id="sel-ocr" class="primary" type="button" data-i18n="OCRを行う">OCRを行う</button>
      <button id="sel-vadd" type="button" data-i18n="ビューアのフォルダへ">ビューアのフォルダへ</button>
      <button id="sel-move" type="button" data-i18n="移動">移動</button>
      <button id="sel-trash" class="danger" type="button" data-i18n="ゴミ箱">ゴミ箱</button>
      <button id="sel-clear" type="button" data-i18n="解除">解除</button>
    </div>
    <div id="ocrbar" hidden>
      <div class="ocr-text"><span id="ocrtext"></span><button id="ocr-cancel" type="button" data-i18n="キャンセル">キャンセル</button><button id="ocr-close" type="button" hidden data-i18n="閉じる">閉じる</button></div>
      <div class="ocr-prog"><div id="ocrprog"></div></div>
    </div>
    <div id="tree-foot" class="sb-foot muted"></div>
  </aside>
  <div id="splitter" role="separator" aria-orientation="vertical" aria-label="コレクションの幅" tabindex="0" data-i18n-label="コレクションの幅"></div>

  <main>
    <section id="deck" aria-label="ページ" data-i18n-label="ページ">
      <div id="pages"></div>
      <div id="emptydeck">
        <div>
          <p class="big" data-i18n="PDFを選んでください">PDFを選んでください</p>
          <p class="muted"><span data-i18n="左のコレクションからPDFを選ぶと、ページが1枚ずつ表示されます。"></span><br>
            <kbd>←</kbd><kbd>→</kbd> <span data-i18n="でページ送り、"></span><kbd>F</kbd> <span data-i18n="で表示の切り替え、"></span><kbd>B</kbd> <span data-i18n="でコレクションの開閉。"></span></p>
        </div>
      </div>
      <button id="prev" class="nav prev" aria-label="前のページ" title="前のページ（←）" data-i18n-title="前のページ（←）" data-i18n-label="前のページ">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="next" class="nav next" aria-label="次のページ" title="次のページ（→）" data-i18n-title="次のページ（→）" data-i18n-label="次のページ">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div id="pagebar" role="group" aria-label="ページ送り" data-i18n-label="ページ送り">
        <button id="prev2" class="icon-btn small" aria-label="前のページ" data-i18n-label="前のページ">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <input id="pageslider" type="range" min="1" max="1" value="1" aria-label="ページ" data-i18n-label="ページ">
        <span id="pageno" aria-live="polite">- / -</span>
        <button id="next2" class="icon-btn small" aria-label="次のページ" data-i18n-label="次のページ">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <span class="vsep"></span>
        <div class="seg small" role="group" aria-label="表示" data-i18n-label="表示">
          <button type="button" data-fit="page" title="ページ全体を1画面に収める（F）" data-i18n-title="ページ全体を1画面に収める（F）" data-i18n="全体">全体</button>
          <button type="button" data-fit="width" title="幅に合わせて縦にスクロール（F）" data-i18n-title="幅に合わせて縦にスクロール（F）" data-i18n="幅">幅</button>
        </div>
        <span class="vsep"></span>
        <div class="seg small" role="group" aria-label="拡大・縮小" data-i18n-label="拡大・縮小">
          <button type="button" id="zoom-out" title="縮小（−）" aria-label="縮小" data-i18n-title="縮小（−）" data-i18n-label="縮小">−</button>
          <button type="button" id="zoom-label" title="拡大率を元に戻す（0）" data-i18n-title="拡大率を元に戻す（0）">100%</button>
          <button type="button" id="zoom-in" title="拡大（+）" aria-label="拡大" data-i18n-title="拡大（+）" data-i18n-label="拡大">+</button>
        </div>
      </div>
    </section>

    <aside id="panel">
      <div id="empty" class="muted"><span data-i18n="PDFを開いたら、上の「このページを認識」で数式を検出・認識します（PDF全体は、⋯ の「OCRを行う」）。"></span><br>
        <span data-i18n="枠をクリックするとLaTeXをコピーし、ここで確認・修正できます。見落とした式は、ページ上をドラッグして追加できます（複数行も可）。"></span></div>
      <details id="notes" open>
        <summary data-i18n="メモ">メモ</summary>
        <div class="seg small" role="group" aria-label="メモの範囲" data-i18n-label="メモの範囲">
          <button type="button" id="note-doc" data-i18n="このPDF" aria-pressed="true">このPDF</button>
          <button type="button" id="note-page" aria-pressed="false"><span data-i18n="このページ">このページ</span> <b id="note-pageno"></b></button>
        </div>
        <textarea id="notetext" rows="6" spellcheck="false" placeholder="PDFの外に保存する補足説明（PDF自体は変わりません）" data-i18n-ph="PDFの外に保存する補足説明（PDF自体は変わりません）" aria-label="メモ" data-i18n-label="メモ"></textarea>
        <div class="muted small" id="notestat" role="status"></div>
      </details>
      <div id="detail" hidden>
        <div class="row"><b id="fid"></b><span id="fstatus" class="badge"></span><span id="fsource" class="muted"></span></div>
        <img id="crop" alt="元PDFの切り出し" data-i18n-alt="元PDFの切り出し">
        <div id="preview" class="preview" aria-label="数式プレビュー" data-i18n-label="数式プレビュー"></div>
        <div id="altbox" hidden>
          <div class="alt-head"><b data-i18n="要確認">要確認</b><span id="altwhy" class="muted"></span></div>
          <div id="altpreview" class="preview" aria-label="もう一方のモデルの数式プレビュー" data-i18n-label="もう一方のモデルの数式プレビュー"></div>
          <textarea id="alttext" readonly rows="2" spellcheck="false" aria-label="もう一方のモデルの読み取り" data-i18n-label="もう一方のモデルの読み取り"></textarea>
          <div class="row"><button id="usealt" type="button" data-i18n="こちらを採用">こちらを採用</button><span class="muted" data-i18n="採用すると、下の欄が置き換わります">採用すると、下の欄が置き換わります</span></div>
        </div>
        <label for="latex" data-i18n="LaTeX（修正可）">LaTeX（修正可）</label>
        <textarea id="latex" spellcheck="false" rows="5"></textarea>
        <div class="row buttons">
          <button id="copy" class="primary" title="C" data-i18n="コピー">コピー</button>
          <button id="save" data-i18n="修正を保存">修正を保存</button>
          <button id="confirm" data-i18n="確定">確定</button>
          <button id="exclude" data-i18n="除外">除外</button>
        </div>
        <div class="row buttons">
          <button id="recognize" data-i18n="この枠を再認識">この枠を再認識</button>
          <button id="redraw" data-i18n="枠を引き直す">枠を引き直す</button>
          <button id="delete" class="danger" data-i18n="削除">削除</button>
        </div>
        <details><summary data-i18n="OCR原文">OCR原文</summary><pre id="ocr"></pre></details>
        <p id="reason" class="muted"></p>
      </div>
    </aside>
  </main>
</div>
<div id="conn" role="alert" hidden>
  <span data-i18n="ビューアに接続できません。ビューアが終了したか、起動し直して接続先が変わった可能性があります。起動し直したときは、表示された新しいURLを開き直してください。">ビューアに接続できません。ビューアが終了したか、起動し直して接続先が変わった可能性があります。起動し直したときは、表示された新しいURLを開き直してください。</span>
  <button id="conn-retry" type="button" data-i18n="再接続">再接続</button>
</div>
<dialog id="dlg" aria-labelledby="dlg-title">
  <form id="dlg-form" method="dialog">
    <h2 id="dlg-title"></h2>
    <p id="dlg-msg" class="muted" hidden></p>
    <input id="dlg-input" type="text" autocomplete="off" spellcheck="false" hidden>
    <div id="dlg-list" role="listbox" aria-label="移動先のフォルダ" hidden data-i18n-label="移動先のフォルダ"></div>
    <div class="dlg-actions">
      <button type="button" id="dlg-cancel" data-i18n="キャンセル">キャンセル</button>
      <button type="submit" id="dlg-ok" class="primary">OK</button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
